<button onclick="cycleColors()" style="background-color: #9b59b6; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px;">
    Click for Next Color! 🌈
</button>

<script>
// 1. This is their list (array) of colors. They can add any colors they want here!
const colors = ["#eef2f3", "#ff7675", "#fdcb6e", "#55efc4", "#74b9ff", "#a29bfe"];
let colorIndex = 0; // Starts at the first color in the list

function cycleColors() {
    // 2. Move to the next color index in the list
    colorIndex = (colorIndex + 1) % colors.length;
    
    // 3. Change the background to the new color
    document.body.style.backgroundColor = colors[colorIndex];
}
</script>
