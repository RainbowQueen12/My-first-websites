<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
  <link rel="stylesheet" "href=3.css">

</head>
<body>
<ul class="todo-list">
  <!-- Item 1 -->
  <li>
    <input type="checkbox" id="todo-task-1">
    <label for="todo-task-1">Buy groceries</label>
    <ul class="sub-item">
      <li><a class="sub-item-link" href="https://example.com" target="_blank">View Grocery List</a></li>
    </ul>
  </li>

  <!-- Item 2 -->
  <li>
    <input type="checkbox" id="todo-task-2">
    <label for="todo-task-2">Finish project</label>
    <ul class="sub-item">
      <li><a class="sub-item-link" href="https://example.com" target="_blank">Open Repository</a></li>
    </ul>
  </li>

  <!-- Item 3 -->
  <li>
    <input type="checkbox" id="todo-task-3">
    <label for="todo-task-3">Workout session</label>
    <ul class="sub-item">
      <li><a class="sub-item-link" href="https://example.com" target="_blank">Routine Video</a></li>
    </ul>
  </li>

  <!-- Item 4 -->
  <li>
    <input type="checkbox" id="todo-task-4">
    <label for="todo-task-4">Read a book</label>
    <ul class="sub-item">
      <li><a class="sub-item-link" href="https://example.com" target="_blank">Digital Library</a></li>
    </ul>
  </li>
</ul>


</body>

</html>
